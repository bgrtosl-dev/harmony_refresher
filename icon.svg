<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
    <!-- App Icon Background -->
    <rect width="120" height="120" rx="26" fill="#2563eb"/>

    <!-- Staff Lines -->
    <line x1="12" y1="44" x2="108" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="52" x2="108" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="60" x2="108" y2="60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="68" x2="108" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="76" x2="108" y2="76" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- 6 Flats in Correct Treble Clef Order & Positions (Bb, Eb, Ab, Db, Gb, Cb) -->
    <!-- 1. Bb on B line (3rd line) -->
    <text x="20" y="66" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
    <!-- 2. Eb on 4th space -->
    <text x="33" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
    <!-- 3. Ab on 2nd space -->
    <text x="46" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
    <!-- 4. Db on 4th line -->
    <text x="59" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
    <!-- 5. Gb on 2nd line -->
    <text x="72" y="74" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
    <!-- 6. Cb on 3rd space -->
    <text x="85" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">♭</text>
</svg>
